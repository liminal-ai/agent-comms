name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build and verify portable release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pnpm build:release "${TAG#v}"
          node "dist/agent-comms-${TAG#v}/comms.mjs" --help
          node "dist/agent-comms-${TAG#v}/connector.mjs" --help
          tar -C dist -czf "agent-comms-${TAG#v}.tar.gz" "agent-comms-${TAG#v}"
          sha256sum "agent-comms-${TAG#v}.tar.gz" > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "agent-comms $TAG" --generate-notes "agent-comms-${TAG#v}.tar.gz" SHA256SUMS
