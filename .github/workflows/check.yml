name: Check
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:release 0.0.0-ci
      - run: node dist/agent-comms-0.0.0-ci/comms.mjs --help
      - run: node dist/agent-comms-0.0.0-ci/connector.mjs --help

      - name: Exercise bundled Windows transport
        if: runner.os == 'Windows'
        run: node packages/windows-pipe/test/bundle.mjs 0.0.0-ci
