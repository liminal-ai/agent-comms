name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:release 0.0.0-ci
      - run: node dist/agent-comms-0.0.0-ci/comms.mjs --help
      - run: node dist/agent-comms-0.0.0-ci/connector.mjs --help
