name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # Windows runs the check suites more slowly (about 14 of its minutes before the packaged smoke).
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 25 || 15 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Test CI classification and validation
        run: node --test scripts/ci-docs.test.mjs
      - name: Classify changes and validate documentation
        id: scope
        run: node scripts/ci-docs.mjs
      - if: steps.scope.outputs.mode != 'docs'
        run: npm install --global pnpm@11.8.0
      - if: steps.scope.outputs.mode != 'docs'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.mode != 'docs'
        run: pnpm check
      - if: steps.scope.outputs.mode != 'docs'
        run: pnpm build:release 0.0.0-ci
      - if: steps.scope.outputs.mode != 'docs'
        run: node dist/agent-comms-0.0.0-ci/comms.mjs --help
      - if: steps.scope.outputs.mode != 'docs'
        run: node dist/agent-comms-0.0.0-ci/connector.mjs --help
      - if: steps.scope.outputs.mode != 'docs'
        run: node dist/agent-comms-0.0.0-ci/service.mjs --help
      - if: steps.scope.outputs.mode != 'docs'
        run: node dist/agent-comms-0.0.0-ci/grokbot.mjs --help
      - name: Exercise local mode from the release
        if: steps.scope.outputs.mode != 'docs'
        run: node scripts/local-smoke.mjs 0.0.0-ci

      - name: Exercise bundled Windows transport
        if: runner.os == 'Windows' && steps.scope.outputs.mode != 'docs'
        run: node packages/windows-pipe/test/bundle.mjs 0.0.0-ci
